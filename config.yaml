camera:
  resolution_width: 848
  resolution_height: 480
plc:
  ip: "192.168.1.165"
  port: 5010
  # --- Communication & Handshake ---
  heartbeat_device: "D1000"    # Check communication
  error_device: "D1100"        # Error code
  trigger_device: "M1000"      # Trigger Send from PLC
  status_device: "M1001"       # Trigger Send cmd received_OK (Handshake)

  # --- 6-DOF Data ---
  point_count_device: "D1101"  # Amount of points (บอกจำนวนชุดข้อมูลที่พบ)

  targets:
    "A":
      Input_X: "D1001"
      Input_Y: "D1002"
      Input_Z: "D1003"
      Input_r: "D1004"
      Input_p: "D1005"
      Input_y: "D1006"
    "B":
      Input_X: "D1011"
      Input_Y: "D1012"
      Input_Z: "D1013"
      Input_r: "D1014"
      Input_p: "D1015"
      Input_y: "D1016"
  
  # ลำดับการเรียงข้อมูลในแต่ละชุด (Offset)
  # 1 ชุดประกอบด้วย 6 registers: X, Y, Z, Roll, Pitch, Yaw
  registers_per_point: 6
  max_points: 5

paths:
  save_dir: "data/templates/model"
  template_dir: "data/templates/model"
  position_mem: "data/logs/position_mem.json"

camera:
  resolution_width: 640
  resolution_height: 480