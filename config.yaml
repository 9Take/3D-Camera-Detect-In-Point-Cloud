camera:
  resolution_width: 640
  resolution_height: 480

charuco:                 # hand-eye calibration board (tools/aruco_calibate.py)
  squares_x: 7    # squares across
  squares_y: 5     # squares down
  square_length: 0.0494  # meters; chessboard square side
  marker_length: 0.025  # meters; ArUco marker side inside the white squares
  dictionary: DICT_6X6_250

programs:
  1:
    name: ProgramA
    template_dir: data/templates/ProgramA
  2:
    name: ProgramB
    template_dir: data/templates/ProgramB
  3:
    name: ProgramC
    template_dir: data/templates/ProgramC
  4:
    name: ProgramD
    template_dir: data/templates/ProgramD

plc:
  ip: 192.168.1.165
  port: 5010

  # PLC -> PC (inputs to the vision system)
  trigger_device:    M1500   # BIT  - start scan
  program_no_device: D1100   # WORD - which program/model to run

  # PC -> PLC (debug-only PLC-side test registers; written from 'b' test mode)
  program_no_test_device: D1500   # WORD - PC writes selected program no. here
  # trigger_test_device:    M1500   # BIT  - PC pulses this to test PLC trigger logic

  # PC -> PLC (status outputs)
  heartbeat_device:    D1000   # WORD - rolling counter
  error_code_device:   D1001   # WORD
  status_error_device: M1001   # BIT  - connection / runtime error
  status_busy_device:  M1002   # BIT  - scan in progress
  status_ready_device: M1000   # BIT  - idle, ready for next trigger
  status_complete_device: M1003 # BIT - results written, awaiting ack

  # PC -> PLC (results)
  # Layout from slot_base_device (shared across all programs):
  #   base+0..3  = slot1 (X, Y, Z, Conf)
  #   base+4..7  = slot2 (X, Y, Z, Conf)
  #   ...
  amount_device:    D1002   # WORD - number of valid points this cycle
  slot_base_device: D1003   # WORD - first register of slot data
  words_per_slot:   4       # X, Y, Z, Conf
  max_points:       5

  heartbeat_interval_sec: 1.0
  poll_interval_sec:      0.1    # how often to poll PLC trigger/program registers
  complete_pulse_sec:     1.0    # hold complete=1 this long after ack so HMI can latch
  position_multiplier:    10000  # meters * 10000 -> int16
  confidence_multiplier:  100    # percent * 100  -> int16

  # Values written to error_code_device
  error_codes:
    ok:              0
    invalid_program: 1
    no_targets:      2
    camera:          3
    internal:        99

robot:
  # Hand-eye calibration result: camera -> gripper (TCP) transform.
  hand_eye_rotation:          # 3x3 R_CAM2GRIPPER
    - [ 0.99851707,  0.04715875, -0.02719773]
    - [-0.02715520, -0.00154225, -0.99963004]
    - [-0.04718325,  0.99888622, -0.00025936]
  hand_eye_translation:       # meters, T_CAM2GRIPPER
    - -0.044947
    - -0.075253
    -  0.043377
  # KUKA jog pose where the photo is captured (SmartPAD WORLD frame)
  scan_pose:
    x:  0.530   # m  (530.0 mm)
    y:  0.015   # m  ( 15.0 mm)
    z:  0.090   # m  ( 90.0 mm)
    a: -90.0    # deg about Z (A)
    b:  0.0     # deg about Y (B)
    c: -180.0   # deg about X (C)

paths:
  debug_dir:    data/templates/debug
  save_dir:     data/logs
  position_mem: data/logs/position_mem.json
