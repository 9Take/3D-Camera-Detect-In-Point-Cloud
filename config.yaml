camera:
  resolution_width: 848
  resolution_height: 480
plc:
  ip: "192.168.1.165"
  port: 5010
  # กำหนด Device สำหรับ Trigger และพิกัด
  trigger_device: "M100"       # PLC ส่งค่ามาเพื่อบอกให้ Vision บันทึกค่า
  status_device: "M101"        # Vision ส่งค่ากลับไปบอกว่าส่งข้อมูลเสร็จแล้ว
  devices:
    x: "D1001"
    y: "D1002"
    z: "D1003"
    roll: "D1004"
    pitch: "D1005"
    yaw: "D1006"
paths:
  template_dir: "data/templates"
  save_dir: "data/logs"
  position_mem: "data/logs/position_mem.json"